<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Ultimate Perfume Quiz</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: '#574755',
              inkdeep: '#3f3038',
              paper: '#f2ebde',
              accent: {
                300: '#e8c291',
                400: '#d8b380',
                500: '#c89670',
              },
              rose: {
                300: '#c9b0b4',
              },
            },
            fontFamily: {
              serif: ['Lora', 'Georgia', 'serif'],
            },
          },
        },
      };
    </script>

    <style>
      html,
      body {
        color: #f2ebde;
        font-family: 'Lora', Georgia, serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      body {
        background:
          radial-gradient(ellipse at 50% 0%, #65525f 0%, #574755 55%, #483a45 100%);
        background-attachment: fixed;
      }
      h1,
      h2,
      h3 {
        font-family: 'Lora', Georgia, serif;
        letter-spacing: -0.005em;
      }
      .eyebrow {
        font-size: 0.72rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        font-weight: 500;
        color: #d8b380;
      }
      .rule {
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(216, 179, 128, 0.45) 20%,
          rgba(216, 179, 128, 0.45) 80%,
          transparent
        );
      }
      .ornament {
        color: #d8b380;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .option-btn {
        transition: background-color 140ms ease, border-color 140ms ease,
          color 140ms ease;
      }
      .option-btn:hover {
        background-color: rgba(216, 179, 128, 0.08);
        border-color: rgba(216, 179, 128, 0.55);
      }
      .option-btn.selected {
        background-color: rgba(216, 179, 128, 0.14);
        border-color: #d8b380;
        color: #e8c291;
      }
      .cta-btn {
        background: linear-gradient(180deg, rgba(216, 179, 128, 0.14), rgba(216, 179, 128, 0.04));
        box-shadow: inset 0 1px 0 rgba(242, 235, 222, 0.06);
      }
      .cta-btn:hover {
        background: linear-gradient(180deg, rgba(216, 179, 128, 0.22), rgba(216, 179, 128, 0.08));
      }
      .fade {
        animation: fadeIn 320ms ease both;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .hairline {
        border-color: rgba(242, 235, 222, 0.16);
      }
      .axis-track {
        background: rgba(242, 235, 222, 0.09);
      }
      .axis-fill-neg,
      .axis-fill-pos {
        background: rgba(216, 179, 128, 0.4);
      }
      .marker {
        box-shadow: 0 0 0 3px #574755, 0 0 10px rgba(216, 179, 128, 0.55);
      }
      .bottle-frame {
        padding: 14px;
        background:
          radial-gradient(ellipse at top, rgba(242, 235, 222, 0.05), rgba(242, 235, 222, 0) 70%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.02));
        border: 1px solid rgba(242, 235, 222, 0.1);
        border-radius: 10px;
      }
      em.quiet {
        font-style: italic;
        color: rgba(242, 235, 222, 0.82);
      }
    </style>
  </head>
  <body>
    <div id="app" class="min-h-screen"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
