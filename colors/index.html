<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colors — HSL Palette Maker</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<header>
  <h1>Colors</h1>
  <nav>
    <button id="tab-active" class="active">Active palette</button>
    <button id="tab-library">Library</button>
  </nav>
  <div class="format-toggle" id="formatToggle" title="Choose how colors are displayed in cell labels and library previews">
    <span class="muted">Show as:</span>
    <button data-fmt="hsl" class="active">HSL</button>
    <button data-fmt="rgb">RGB</button>
    <button data-fmt="hex">Hex</button>
    <button data-fmt="hsv">HSV</button>
  </div>
</header>
<main>
  <!-- ============ Active palette view ============ -->
  <section id="view-active">
    <div class="palette-row" id="paletteRow"></div>

    <div class="detail">
      <h2 id="detailHeader">Selected color</h2>
      <div class="detail-row">
        <div id="largeSwatch" class="swatch-large"></div>
        <div class="sliders">
          <div class="slider-row">
            <label for="hSlider">H</label>
            <input type="range" id="hSlider" min="0" max="360" step="1">
            <input type="number" id="hInput" min="0" max="360" step="1" aria-label="Hue">
          </div>
          <div class="slider-row">
            <label for="sSlider">S</label>
            <input type="range" id="sSlider" min="0" max="100" step="1">
            <input type="number" id="sInput" min="0" max="100" step="1" aria-label="Saturation">
          </div>
          <div class="slider-row">
            <label for="lSlider">L</label>
            <input type="range" id="lSlider" min="0" max="100" step="1">
            <input type="number" id="lInput" min="0" max="100" step="1" aria-label="Lightness">
          </div>
          <div class="formats" id="formats"></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <input type="text" id="titleInput" placeholder="Palette title" aria-label="Palette title">
      <button class="btn primary" id="saveBtn">Save</button>
      <button class="btn" id="invertBtn">Invert palette</button>
      <button class="btn" id="downloadBtn">Download PNG</button>
      <button class="btn" id="newBtn">New</button>
    </div>
  </section>

  <!-- ============ Library view ============ -->
  <section id="view-library" class="hidden">
    <p id="libEmpty" class="muted hidden">No saved palettes yet. Create one in the Active tab and click Save.</p>
    <div class="library" id="library"></div>
  </section>
</main>
</body>
</html>
